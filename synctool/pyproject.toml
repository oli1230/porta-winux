[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synctool"
version = "0.1.0"
description = "Portable snapshot/checkout/commit/sync tool over restic for external-drive system backups"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# The interactive browser. Everything else works without it.
tui = ["textual>=0.50"]
dev = ["ruff", "pytest"]

[project.scripts]
synctool = "synctool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
