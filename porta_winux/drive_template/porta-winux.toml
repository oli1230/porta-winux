# porta-winux drive manifest — this file marks the drive root.
# Profiles are named sets of paths to back up. Keep v1 scoped to an
# explicit slice of the system; full-OS concerns (packages, machine-id,
# hardware config) belong to the future ansible/kickstart module.

[porta-winux]
default_profile = "home"

[profiles.home]
paths = ["/home"]
excludes = [
  "**/.cache",
  "**/node_modules",
  "**/.venv",
  "**/venv",
  "**/__pycache__",
  "**/.local/share/Trash",
  "**/*.iso",
]

[profiles.etc]
paths = ["/etc"]
excludes = ["/etc/shadow*", "/etc/gshadow*"]

# Everything at once:
[profiles.all]
paths = ["/home", "/etc", "/usr/local"]
excludes = [
  "**/.cache", "**/node_modules", "**/.venv", "**/__pycache__",
  "/etc/shadow*", "/etc/gshadow*",
]
